name: Package Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'packages/tallcms/cms/**'
      - '.github/workflows/package-tests.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'packages/tallcms/cms/**'
      - '.github/workflows/package-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        exclude:
          # Laravel 13 requires PHP 8.3+
          - laravel: '13.*'
            php: '8.2'

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, json, bcmath, curl, zip, gd, sqlite3, sodium, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        working-directory: packages/tallcms/cms
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-${{ hashFiles('packages/tallcms/cms/composer.json') }}
          restore-keys: ${{ runner.os }}-php-${{ matrix.php }}-laravel-${{ matrix.laravel }}-composer-

      - name: Install dependencies
        working-directory: packages/tallcms/cms
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update
          composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Audit Composer dependencies
        working-directory: packages/tallcms/cms
        run: composer audit --locked

      - name: Run tests
        working-directory: packages/tallcms/cms
        run: vendor/bin/phpunit
